<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="popup-container">
            <div class="header">
                <span class="logo">🤖 WeBWorK-GPT</span>
            </div>
            <div class="status-row">
                <span>Extension Status</span>
                <label class="switch">
                    <input type="checkbox" id="enabled-toggle" />
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="status-row">
                <div class="label-group">
                    <span>Re-do Mode</span>
                    <small>clear answers on load for re-do</small>
                </div>
                <label class="switch">
                    <input type="checkbox" id="redo-toggle" />
                    <span class="slider round"></span>
                </label>
            </div>
            <button id="open-settings" class="btn-secondary">
                ⚙️ Settings & Disclaimer
            </button>
            <div class="backup-section">
                <button id="export-btn" class="btn-outline">📤 Backup (Export)</button>
                <button id="import-btn" class="btn-outline">📥 Restore (Import)</button>
            </div>
            <div id="popup-status" class="status-message hidden"></div>
        </div>
        <script type="module" src="popup.js"></script>
    </body>
</html>
