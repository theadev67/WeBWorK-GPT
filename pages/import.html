<!DOCTYPE html>
<html>
    <head>
        <title>Restore Backup - WeBWorK-GPT</title>
        <meta charset="UTF-8" />
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Roboto, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                background: #f8fafc;
                color: #1e293b;
            }
            .container {
                background: white;
                padding: 2.5rem;
                border-radius: 16px;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1),
                    0 8px 10px -6px rgba(0, 0, 0, 0.05);
                max-width: 440px;
                width: 90%;
                text-align: center;
            }
            .logo {
                font-size: 2.5rem;
                margin-bottom: 1rem;
                display: block;
            }
            h1 {
                font-size: 1.5rem;
                margin: 0 0 0.75rem 0;
                color: #0f172a;
            }
            p {
                color: #64748b;
                font-size: 0.95rem;
                line-height: 1.6;
                margin-bottom: 2rem;
            }
            .file-input-label {
                display: inline-block;
                background: #1e40af;
                color: white;
                padding: 14px 28px;
                border-radius: 10px;
                cursor: pointer;
                font-weight: 600;
                font-size: 1rem;
                transition: all 0.2s;
                box-shadow: 0 4px 6px -1px rgba(30, 64, 175, 0.2);
            }
            .file-input-label:hover {
                background: #1d4ed8;
                transform: translateY(-1px);
                box-shadow: 0 6px 12px -2px rgba(30, 64, 175, 0.3);
            }
            .file-input-label:active {
                transform: translateY(0);
            }
            #file-input {
                display: none;
            }
            #status {
                margin-top: 2rem;
                padding: 12px;
                border-radius: 8px;
                font-size: 0.95rem;
                font-weight: 500;
                min-height: 20px;
                transition: all 0.3s;
            }
            .status-info {
                background: #eff6ff;
                color: #1e40af;
                border: 1px solid #bfdbfe;
            }
            .status-success {
                background: #f0fdf4;
                color: #166534;
                border: 1px solid #bbf7d0;
            }
            .status-error {
                background: #fef2f2;
                color: #991b1b;
                border: 1px solid #fecaca;
            }
            .hidden {
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <span class="logo">🤖</span>
            <h1>Restore Backup</h1>
            <p>
                Select your WeBWorK-GPT backup file (.json) to restore your
                history, notes, and settings.
            </p>

            <label for="file-input" class="file-input-label">
                📂 Choose Backup File
            </label>
            <input type="file" id="file-input" accept=".json" />

            <div id="status" class="hidden"></div>
        </div>
        <script type="module" src="import.js"></script>
    </body>
</html>
